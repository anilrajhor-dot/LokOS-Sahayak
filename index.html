<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>LokOS Sahayak — Field Staff Support</title>
<style>
  :root{
    --ivy: #1F3D2B;
    --ivy-light: #2E5540;
    --sand: #EFE6D0;
    --sand-dark: #E0D3AF;
    --moss: #7C9473;
    --marigold: #D9A441;
    --ink: #2B2B26;
    --white: #FFFFFF;
    --danger: #B4482F;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Devanagari",Helvetica,Arial,sans-serif;
    background:var(--sand);
    color:var(--ink);
  }
  body{
    display:flex; flex-direction:column;
    height:100vh; height:100dvh;
    overflow:hidden;
  }

  /* Header */
  header{
    background:var(--ivy);
    color:var(--white);
    padding:14px 16px;
    display:flex; align-items:center; gap:10px;
    flex-shrink:0;
    box-shadow:0 2px 6px rgba(0,0,0,0.15);
  }
  .header-badge{
    width:38px; height:38px; border-radius:10px;
    background:var(--marigold);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:17px; color:var(--ivy);
    flex-shrink:0;
  }
  header h1{
    font-size:16px; margin:0; font-weight:600; line-height:1.25;
  }
  header p{
    margin:1px 0 0; font-size:12px; color:#CFE0D2; font-weight:400;
  }
  .header-actions{
    margin-left:auto;
    display:flex; align-items:center; gap:6px;
  }
  .lang-toggle{
    display:flex; background:rgba(255,255,255,0.14); border-radius:20px; padding:2px;
  }
  .lang-toggle button{
    border:none; background:transparent; color:#CFE0D2;
    font-size:12px; font-weight:600; padding:6px 10px; border-radius:18px;
    cursor:pointer;
  }
  .lang-toggle button.active{ background:var(--marigold); color:var(--ivy); }
  .reset-btn{
    background:rgba(255,255,255,0.12);
    border:none; color:var(--white);
    font-size:11px; padding:7px 10px; border-radius:20px;
    cursor:pointer;
  }

  /* Chat area */
  #chat{
    flex:1; overflow-y:auto;
    padding:16px 12px 8px;
    -webkit-overflow-scrolling:touch;
  }
  .msg{
    max-width:84%;
    margin-bottom:10px;
    padding:10px 13px;
    border-radius:14px;
    font-size:14.5px;
    line-height:1.5;
    white-space:pre-wrap;
    animation:rise .18s ease-out;
  }
  @keyframes rise{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .bot{
    background:var(--white);
    color:var(--ink);
    border-bottom-left-radius:4px;
    margin-right:auto;
    box-shadow:0 1px 2px rgba(0,0,0,0.06);
  }
  .user{
    background:var(--ivy);
    color:var(--white);
    border-bottom-right-radius:4px;
    margin-left:auto;
  }
  .msg strong{display:block; font-size:12px; text-transform:uppercase; letter-spacing:.03em; opacity:.55; margin-bottom:4px; font-weight:600;}
  .bot strong{color:var(--moss);}
  .user strong{color:#CFE0D2;}

  .chips{
    display:flex; flex-wrap:wrap; gap:8px;
    margin:6px 0 14px;
  }
  .chip{
    background:var(--white);
    border:1.5px solid var(--sand-dark);
    color:var(--ivy);
    padding:8px 13px;
    border-radius:20px;
    font-size:13.5px;
    cursor:pointer;
    font-weight:500;
  }
  .chip:active{background:var(--sand-dark);}

  .escalate-box{
    background:#FBF3E4;
    border:1.5px dashed var(--marigold);
    border-radius:12px;
    padding:12px 14px;
    margin:4px 0 14px;
    font-size:13.5px;
  }
  .escalate-box button{
    margin-top:8px;
    background:var(--marigold);
    border:none; color:var(--ivy);
    font-weight:700; font-size:13px;
    padding:8px 14px; border-radius:8px;
    cursor:pointer;
  }

  /* Input bar */
  #inputBar{
    flex-shrink:0;
    display:flex; gap:8px;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:var(--white);
    border-top:1px solid var(--sand-dark);
  }
  #textInput{
    flex:1;
    border:1.5px solid var(--sand-dark);
    border-radius:22px;
    padding:11px 16px;
    font-size:15px;
    outline:none;
    background:var(--sand);
    color:var(--ink);
  }
  #textInput:focus{border-color:var(--moss);}
  #sendBtn{
    background:var(--ivy);
    color:var(--white);
    border:none;
    border-radius:22px;
    padding:0 20px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    flex-shrink:0;
  }
  #sendBtn:active{background:var(--ivy-light);}

  ::-webkit-scrollbar{width:0;}
</style>
</head>
<body>

<header>
  <div class="header-badge">LS</div>
  <div>
    <h1>LokOS Sahayak</h1>
    <p id="subtitle">Field staff support · answers anytime</p>
  </div>
  <div class="header-actions">
    <div class="lang-toggle">
      <button id="langEnBtn" class="active" onclick="setLang('en')">EN</button>
      <button id="langHiBtn" onclick="setLang('hi')">हिं</button>
    </div>
    <button class="reset-btn" onclick="resetChat()">Restart</button>
  </div>
</header>

<div id="chat"></div>

<div id="inputBar">
  <input id="textInput" type="text" placeholder="Type your question…" autocomplete="off" />
  <button id="sendBtn" onclick="handleSend()">Send</button>
</div>

<script>

    },
    escalateHint: {
      en: "If the same document keeps failing after these steps, I'll log it for a technical check.",
      hi: "अगर वही दस्तावेज़ बार-बार फेल हो रहा है, तो मैं इसे तकनीकी जांच के लिए लॉग कर दूँगा।"

    }
  }

    reset: "फिर से शुरू करें",
    you: "आप",
    bot: "सहायक",
    greeting: "नमस्ते! मैं LokOS सहायक हूँ — सामान्य ऐप समस्याओं में मदद के लिए, हर समय उपलब्ध।\n\nनीचे कोई विषय चुनें, या अपने शब्दों में सवाल टाइप करें।",
    notFound: "इसके लिए सीधा जवाब नहीं मिला। अलग शब्दों में कोशिश करें, नीचे कोई विषय चुनें, या \"not resolved\" लिखें — मैं इसे सहायता टीम के लिए लॉग कर दूँगा।",
    resolvedReply: "अच्छा लगा कि इससे मदद मिली! कभी भी दूसरा सवाल पूछें।",
    askResolved: "क्या इससे समस्या हल हुई? \"resolved\" या \"not resolved\" टाइप करें।",
    escalateDefault: "अभी भी समस्या है? मैं इसे सहायता टीम के लिए लॉग कर दूँगा।",
    escalateDefaultUnmatched: "मैं इस सवाल को सहायता टीम के लिए लॉग कर दूँगा।",
    logButton: "सहायता के लिए लॉग करें",
    loggedPrefix: "लॉग हो गया। संदर्भ: ",
    loggedNote: "सहायता टीम लॉग किए गए सवालों की समीक्षा कर सकती है और इस विषय को गाइड में जोड़ सकती है।"
  }
};

let lang = 'en';
let lastMatched = null; // holds last matched KB entry for escalation context

const chat = document.getElementById('chat');
const input = document.getElementById('textInput');

function setLang(l){
  lang = l;
  document.getElementById('langEnBtn').classList.toggle('active', l === 'en');
  document.getElementById('langHiBtn').classList.toggle('active', l === 'hi');
  document.getElementById('subtitle').textContent = STRINGS[lang].subtitle;
  input.placeholder = STRINGS[lang].placeholder;
  document.getElementById('sendBtn').textContent = STRINGS[lang].send;
  document.querySelector('.reset-btn').textContent = STRINGS[lang].reset;
  resetChat();
}

function addMsg(text, who){
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  const label = document.createElement('strong');
  label.textContent = who === 'bot' ? STRINGS[lang].bot : STRINGS[lang].you;
  div.appendChild(label);
  div.appendChild(document.createTextNode(text));
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function addChips(){
  const wrap = document.createElement('div');
  wrap.className = 'chips';
  KB.forEach(entry=>{
    const c = document.createElement('button');
    c.className = 'chip';
    c.textContent = entry.label[lang];
    c.onclick = ()=> submitQuery(entry.keywords[0], entry.label[lang]);
    wrap.appendChild(c);
  });
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

function findMatch(query){
  const q = query.toLowerCase();
  let best = null, bestScore = 0;
  KB.forEach(entry=>{
    let score = 0;
    entry.keywords.forEach(k=>{ if(q.includes(k.toLowerCase())) score++; });
    if(score > bestScore){ bestScore = score; best = entry; }
  });
  return bestScore > 0 ? best : null;
}

function isResolvedSaid(q){
  return /\b(resolved|solved|thanks|thank you|fixed|works|ok got it|okay got it)\b/i.test(q) ||
         /(हल हो गया|धन्यवाद|शुक्रिया|ठीक हो गया)/.test(q);
}
function isNotResolvedSaid(q){
  return /\b(not resolved|not working|still|didn'?t work|no|escalate|need help|talk to someone|human)\b/i.test(q) ||
         /(हल नहीं|काम नहीं|अभी भी|नहीं हुआ)/.test(q);
}

function submitQuery(query, displayLabel){
  addMsg(displayLabel || query, 'user');
  respondTo(query);
}

function respondTo(query){
  if(isNotResolvedSaid(query) && lastMatched){
    showEscalation(lastMatched, query);
    return;
  }
  if(isResolvedSaid(query)){
    addMsg(STRINGS[lang].resolvedReply, 'bot');
    addChips();
    return;
  }

  const match = findMatch(query);
  if(match){
    lastMatched = match;
    addMsg(match.answer[lang], 'bot');
    addMsg(STRINGS[lang].askResolved, 'bot');
  } else {
    lastMatched = null;
    addMsg(STRINGS[lang].notFound, 'bot');
    showEscalation(null, query);
  }
}

function showEscalation(entry, originalQuery){
  const box = document.createElement('div');
  box.className = 'escalate-box';
  const hintText = entry
    ? (entry.escalateHint ? entry.escalateHint[lang] : STRINGS[lang].escalateDefault)
    : STRINGS[lang].escalateDefaultUnmatched;
  box.innerHTML = hintText + "<br><button type='button'>" + STRINGS[lang].logButton + "</button>";
  box.querySelector('button').onclick = ()=> logEscalation(entry, originalQuery, box);
  chat.appendChild(box);
  chat.scrollTop = chat.scrollHeight;
}

function logEscalation(entry, originalQuery, box){
  const ticket = {
    time: new Date().toISOString(),
    category: entry ? entry.id : 'UNMATCHED',
    query: originalQuery,
    lang: lang
  };
  try{
    const existing = JSON.parse(localStorage.getItem('lokos_tickets') || '[]');
    existing.push(ticket);
    localStorage.setItem('lokos_tickets', JSON.stringify(existing));
  }catch(e){}
  box.innerHTML = STRINGS[lang].loggedPrefix + ticket.time.slice(0,16).replace('T',' ') +
    "<br><span style='font-size:12px;opacity:.7'>" + STRINGS[lang].loggedNote + "</span>";
  addChips();
}

function handleSend(){
  const val = input.value.trim();
  if(!val) return;
  input.value = '';
  submitQuery(val);
}

input.addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ handleSend(); }
});

function resetChat(){
  chat.innerHTML = '';
  lastMatched = null;
  addMsg(STRINGS[lang].greeting, 'bot');
  addChips();
}

resetChat();
</script>
