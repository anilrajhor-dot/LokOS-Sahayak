<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>LokOS Sahayak — Field Staff Support</title>
<style>
  :root{
    --ivy: #1F3D2B;
    --ivy-light: #2E5540;
    --sand: #EFE6D0;
    --sand-dark: #E0D3AF;
    --moss: #7C9473;
    --marigold: #D9A441;
    --ink: #2B2B26;
    --white: #FFFFFF;
    --danger: #B4482F;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Devanagari",Helvetica,Arial,sans-serif;
    background:var(--sand);
    color:var(--ink);
  }
  body{
    display:flex; flex-direction:column;
    height:100vh; height:100dvh;
    overflow:hidden;
  }

  /* Header */
  header{
    background:var(--ivy);
    color:var(--white);
    padding:14px 16px;
    display:flex; align-items:center; gap:10px;
    flex-shrink:0;
    box-shadow:0 2px 6px rgba(0,0,0,0.15);
  }
  .header-badge{
    width:38px; height:38px; border-radius:10px;
    background:var(--marigold);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:17px; color:var(--ivy);
    flex-shrink:0;
  }
  header h1{
    font-size:16px; margin:0; font-weight:600; line-height:1.25;
  }
  header p{
    margin:1px 0 0; font-size:12px; color:#CFE0D2; font-weight:400;
  }
  .header-actions{
    margin-left:auto;
    display:flex; align-items:center; gap:6px;
  }
  .lang-toggle{
    display:flex; background:rgba(255,255,255,0.14); border-radius:20px; padding:2px;
  }
  .lang-toggle button{
    border:none; background:transparent; color:#CFE0D2;
    font-size:12px; font-weight:600; padding:6px 10px; border-radius:18px;
    cursor:pointer;
  }
  .lang-toggle button.active{ background:var(--marigold); color:var(--ivy); }
  .reset-btn{
    background:rgba(255,255,255,0.12);
    border:none; color:var(--white);
    font-size:11px; padding:7px 10px; border-radius:20px;
    cursor:pointer;
  }

  /* Chat area */
  #chat{
    flex:1; overflow-y:auto;
    padding:16px 12px 8px;
    -webkit-overflow-scrolling:touch;
  }
  .msg{
    max-width:84%;
    margin-bottom:10px;
    padding:10px 13px;
    border-radius:14px;
    font-size:14.5px;
    line-height:1.5;
    white-space:pre-wrap;
    animation:rise .18s ease-out;
  }
  @keyframes rise{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .bot{
    background:var(--white);
    color:var(--ink);
    border-bottom-left-radius:4px;
    margin-right:auto;
    box-shadow:0 1px 2px rgba(0,0,0,0.06);
  }
  .user{
    background:var(--ivy);
    color:var(--white);
    border-bottom-right-radius:4px;
    margin-left:auto;
  }
  .msg strong{display:block; font-size:12px; text-transform:uppercase; letter-spacing:.03em; opacity:.55; margin-bottom:4px; font-weight:600;}
  .bot strong{color:var(--moss);}
  .user strong{color:#CFE0D2;}

  .chips{
    display:flex; flex-wrap:wrap; gap:8px;
    margin:6px 0 14px;
  }
  .chip{
    background:var(--white);
    border:1.5px solid var(--sand-dark);
    color:var(--ivy);
    padding:8px 13px;
    border-radius:20px;
    font-size:13.5px;
    cursor:pointer;
    font-weight:500;
  }
  .chip:active{background:var(--sand-dark);}

  .escalate-box{
    background:#FBF3E4;
    border:1.5px dashed var(--marigold);
    border-radius:12px;
    padding:12px 14px;
    margin:4px 0 14px;
    font-size:13.5px;
  }
  .escalate-box button{
    margin-top:8px;
    background:var(--marigold);
    border:none; color:var(--ivy);
    font-weight:700; font-size:13px;
    padding:8px 14px; border-radius:8px;
    cursor:pointer;
  }

  /* Input bar */
  #inputBar{
    flex-shrink:0;
    display:flex; gap:8px;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:var(--white);
    border-top:1px solid var(--sand-dark);
  }
  #textInput{
    flex:1;
    border:1.5px solid var(--sand-dark);
    border-radius:22px;
    padding:11px 16px;
    font-size:15px;
    outline:none;
    background:var(--sand);
    color:var(--ink);
  }
  #textInput:focus{border-color:var(--moss);}
  #sendBtn{
    background:var(--ivy);
    color:var(--white);
    border:none;
    border-radius:22px;
    padding:0 20px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    flex-shrink:0;
  }
  #sendBtn:active{background:var(--ivy-light);}

  ::-webkit-scrollbar{width:0;}
</style>
</head>
<body>

<header>
  <div class="header-badge">LS</div>
  <div>
    <h1>LokOS Sahayak</h1>
    <p id="subtitle">Field staff support · answers anytime</p>
  </div>
  <div class="header-actions">
    <div class="lang-toggle">
      <button id="langEnBtn" class="active" onclick="setLang('en')">EN</button>
      <button id="langHiBtn" onclick="setLang('hi')">हिं</button>
    </div>
    <button class="reset-btn" onclick="resetChat()">Restart</button>
  </div>
</header>

<div id="chat"></div>

<div id="inputBar">
  <input id="textInput" type="text" placeholder="Type your question…" autocomplete="off" />
  <button id="sendBtn" onclick="handleSend()">Send</button>
</div>

<script>
/* ========================================================
   KNOWLEDGE BASE — edit this array to add/update Q&A.
   Each entry has bilingual fields:
     label      : {en, hi}  — short topic chip label
     keywords   : array of lowercase words/phrases in BOTH
                  English and Hindi (Devanagari or Hinglish)
                  that should trigger this entry
     answer     : {en, hi}  — the fix steps shown to the user
     escalateHint: {en, hi} — shown only if user says it's
                  still not resolved
   ======================================================== */
const KB = [
  {
    id: "LOGIN-01",
    label: { en: "OTP / Login", hi: "OTP / लॉगिन" },
    keywords: ["otp", "login", "log in", "sign in", "password",
               "लॉगिन", "ओटीपी", "पासवर्ड"],
    answer: {
      en: "OTP / Login issue:\n1. Check network signal, wait 60 seconds and retry.\n2. Confirm your mobile number matches the one registered in your LokOS profile.\n3. Try 'Resend OTP' — max 3 attempts, then wait 10 minutes.\n4. Check if DND is active on your SIM.",
      hi: "OTP / लॉगिन समस्या:\n1. नेटवर्क सिग्नल चेक करें, 60 सेकंड रुककर दोबारा कोशिश करें।\n2. सुनिश्चित करें कि आपका मोबाइल नंबर LokOS प्रोफ़ाइल में रजिस्टर्ड नंबर से मेल खाता है।\n3. 'Resend OTP' आज़माएं — अधिकतम 3 बार, फिर 10 मिनट रुकें।\n4. जांचें कि आपकी SIM पर DND एक्टिव तो नहीं है।"
    },
    escalateHint: {
      en: "If your registered number itself is wrong or changed, this needs an admin correction — I'll log it for you.",
      hi: "अगर आपका रजिस्टर्ड नंबर ही गलत है या बदल गया है, तो इसे एडमिन से ठीक करवाना होगा — मैं इसे लॉग कर दूँगा।"
    }
  },
  {
    id: "AADHAAR-01",
    label: { en: "Aadhaar", hi: "आधार" },
    keywords: ["aadhaar", "adhar", "ekyc", "kyc", "verification failed",
               "आधार", "सत्यापन", "ekyc फेल"],
    answer: {
      en: "Aadhaar verification issue:\n1. Re-check the spelling of the name exactly as printed on the Aadhaar card — no short forms.\n2. Confirm date of birth format is correct.\n3. Retry on a stronger network connection.\n4. If it still fails, use the manual Aadhaar upload + offline verification option.",
      hi: "आधार सत्यापन समस्या:\n1. नाम की स्पेलिंग आधार कार्ड पर छपी हुई के अनुसार ही जांचें — शॉर्ट फॉर्म न लिखें।\n2. जन्म तिथि का फॉर्मेट सही है यह सुनिश्चित करें।\n3. बेहतर नेटवर्क कनेक्शन पर दोबारा कोशिश करें।\n4. फिर भी न हो तो मैनुअल आधार अपलोड + ऑफ़लाइन सत्यापन विकल्प का उपयोग करें।"
    },
    escalateHint: {
      en: "If it fails again after 3 tries with correct data, this is likely a backend/UIDAI-side issue.",
      hi: "अगर सही जानकारी के बावजूद 3 बार फिर फेल हो, तो यह बैकएंड/UIDAI की तरफ़ की समस्या हो सकती है।"
    }
  },
  {
    id: "SYNC-01",
    label: { en: "Sync issue", hi: "सिंक समस्या" },
    keywords: ["sync", "syncing", "upload", "not uploading", "offline",
               "सिंक", "अपलोड नहीं", "डेटा नहीं गया"],
    answer: {
      en: "Data not syncing:\n1. Move to an area with a stable network connection.\n2. Do not close the app while sync is in progress.\n3. Check your device storage isn't full.\n4. Use the 'Retry Sync' option from the app menu.",
      hi: "डेटा सिंक नहीं हो रहा:\n1. स्थिर नेटवर्क वाली जगह पर जाएं।\n2. सिंक होते समय ऐप को बंद न करें।\n3. जांचें कि आपके डिवाइस की स्टोरेज फुल तो नहीं है।\n4. ऐप मेन्यू से 'Retry Sync' विकल्प इस्तेमाल करें।"
    },
    escalateHint: {
      en: "If it shows 'synced' on your device but isn't visible on the admin dashboard after 24 hours, that's a backend issue — I'll log it.",
      hi: "अगर आपके डिवाइस पर 'synced' दिख रहा है पर 24 घंटे बाद भी एडमिन डैशबोर्ड पर नहीं दिख रहा, तो यह बैकएंड समस्या है — मैं इसे लॉग कर दूँगा।"
    }
  },
  {
    id: "LOAN-01",
    label: { en: "Loan status", hi: "लोन स्थिति" },
    keywords: ["loan", "disbursement", "approval", "application stuck",
               "लोन", "स्वीकृति", "वितरण", "अटका हुआ"],
    answer: {
      en: "Loan application stuck:\n1. Check the current status/stage shown in the app.\n2. Note which role needs to approve next — VO, CLF, or Bank level.\n3. Follow up directly with that specific approver — this is usually a pending-approval matter, not a technical fault.",
      hi: "लोन आवेदन अटका हुआ है:\n1. ऐप में दिख रही मौजूदा स्थिति/चरण देखें।\n2. जानें कि अगला अनुमोदन किस स्तर पर लंबित है — VO, CLF या बैंक स्तर।\n3. उस संबंधित अनुमोदक से सीधे संपर्क करें — यह आमतौर पर तकनीकी खराबी नहीं, बल्कि लंबित अनुमोदन का मामला होता है।"
    },
    escalateHint: {
      en: "If it has been stuck beyond 7 days with no movement at all, I'll log this for an MIS/admin check.",
      hi: "अगर 7 दिन से ज़्यादा हो गए और कोई प्रगति नहीं हुई, तो मैं इसे MIS/एडमिन जांच के लिए लॉग कर दूँगा।"
    }
  },
  {
    id: "DOC-01",
    label: { en: "Document upload", hi: "दस्तावेज़ अपलोड" },
    keywords: ["document", "photo", "upload failed", "pdf", "id proof",
               "दस्तावेज़", "फोटो", "अपलोड फेल", "आईडी प्रूफ"],
    answer: {
      en: "Document upload issue:\n1. Check file size — very large photos may fail to upload.\n2. Ensure the file is in the accepted format (PDF/JPEG).\n3. Retry on a stronger connection.\n4. Restart the app if the upload screen is frozen.",
      hi: "दस्तावेज़ अपलोड समस्या:\n1. फ़ाइल का साइज़ जांचें — बहुत बड़ी फोटो अपलोड नहीं हो पाती।\n2. फ़ाइल सही फॉर्मेट (PDF/JPEG) में होनी चाहिए।\n3. बेहतर नेटवर्क पर दोबारा कोशिश करें।\n4. अगर अपलोड स्क्रीन अटक जाए तो ऐप रीस्टार्ट करें।"
    },
    escalateHint: {
      en: "If the same document keeps failing after these steps, I'll log it for a technical check.",
      hi: "अगर वही दस्तावेज़ बार-बार फेल हो रहा है, तो मैं इसे तकनीकी जांच के लिए लॉग कर दूँगा।"
    }
  },
  {
    id: "MEETING-01",
    label: { en: "Meeting entry", hi: "बैठक प्रविष्टि" },
    keywords: ["meeting", "attendance", "transaction entry", "savings entry", "wrong amount entered",
               "बैठक", "उपस्थिति", "लेनदेन", "बचत प्रविष्टि", "गलत राशि"],
    answer: {
      en: "Meeting / transaction entry issue:\n1. Confirm you selected the correct SHG/VO/CLF before entering data — wrong entity selection is the most common cause of mismatched entries.\n2. If an amount was entered wrong, use the edit/correction option before final submission — once submitted, it may need admin-level correction.\n3. Make sure all member attendance is marked before saving the meeting.\n4. If the meeting won't save at all, check network connection and retry.",
      hi: "बैठक / लेनदेन प्रविष्टि समस्या:\n1. डेटा दर्ज करने से पहले सही SHG/VO/CLF चुना है, यह सुनिश्चित करें — गलत इकाई चुनना सबसे सामान्य गलती है।\n2. अगर राशि गलत दर्ज हो गई है, तो अंतिम सबमिशन से पहले एडिट/सुधार विकल्प का उपयोग करें — सबमिट होने के बाद एडमिन स्तर पर सुधार करना पड़ सकता है।\n3. बैठक सेव करने से पहले सभी सदस्यों की उपस्थिति दर्ज करें।\n4. अगर बैठक सेव ही नहीं हो रही, तो नेटवर्क कनेक्शन जांचकर दोबारा कोशिश करें।"
    },
    escalateHint: {
      en: "If an already-submitted entry needs correction and there's no edit option visible, I'll log it for admin-level correction.",
      hi: "अगर पहले से सबमिट हो चुकी प्रविष्टि में सुधार चाहिए और एडिट विकल्प नहीं दिख रहा, तो मैं इसे एडमिन-स्तर सुधार के लिए लॉग कर दूँगा।"
    }
  },
  {
    id: "PROFILE-01",
    label: { en: "Profile issue", hi: "प्रोफ़ाइल समस्या" },
    keywords: ["profile", "member details", "wrong name", "spelling", "duplicate member",
               "प्रोफ़ाइल", "सदस्य विवरण", "नाम गलत", "स्पेलिंग", "डुप्लीकेट सदस्य"],
    answer: {
      en: "Member / SHG / VO / CLF profile issue:\n1. For spelling or detail corrections, check if the 'Edit Profile' option is available for that record.\n2. For a duplicate member showing up, do not create a fresh entry — this needs to be merged/flagged, not re-entered.\n3. Confirm the correct hierarchy (SHG under correct VO, VO under correct CLF) before making changes.",
      hi: "सदस्य / SHG / VO / CLF प्रोफ़ाइल समस्या:\n1. स्पेलिंग या विवरण सुधार के लिए, उस रिकॉर्ड में 'Edit Profile' विकल्प उपलब्ध है या नहीं जांचें।\n2. अगर कोई सदस्य डुप्लीकेट दिख रहा है, तो नई प्रविष्टि न बनाएं — इसे मर्ज/फ्लैग करवाना होगा, दोबारा एंट्री नहीं करनी है।\n3. बदलाव करने से पहले सही पदानुक्रम (सही VO के अंतर्गत SHG, सही CLF के अंतर्गत VO) सुनिश्चित करें।"
    },
    escalateHint: {
      en: "Duplicate records and locked profile fields need an admin-level fix — I'll log the details.",
      hi: "डुप्लीकेट रिकॉर्ड और लॉक की गई प्रोफ़ाइल फ़ील्ड्स के लिए एडमिन-स्तर सुधार चाहिए — मैं विवरण लॉग कर दूँगा।"
    }
  },
  {
    id: "CRASH-01",
    label: { en: "App crash", hi: "ऐप क्रैश" },
    keywords: ["crash", "hang", "freeze", "slow", "not opening", "app closed",
               "क्रैश", "हैंग", "अटक गया", "धीमा", "खुल नहीं रहा", "बंद हो गया"],
    answer: {
      en: "App crashing / freezing / slow:\n1. Force-close the app fully and reopen it.\n2. Check for a pending app update in the Play Store.\n3. Restart your phone if the issue continues.\n4. Free up storage space — a nearly-full device commonly causes slowdowns and crashes.\n5. Make sure you're on a reasonably recent version of your phone's operating system.",
      hi: "ऐप क्रैश / हैंग / धीमा होना:\n1. ऐप को पूरी तरह बंद करें और दोबारा खोलें।\n2. Play Store में कोई पेंडिंग अपडेट है या नहीं जांचें।\n3. समस्या बनी रहे तो फ़ोन रीस्टार्ट करें।\n4. स्टोरेज स्पेस खाली करें — लगभग फुल डिवाइस अक्सर धीमापन और क्रैश की वजह बनता है।\n5. सुनिश्चित करें कि आपके फ़ोन का ऑपरेटिंग सिस्टम अपेक्षाकृत नया वर्ज़न है।"
    },
    escalateHint: {
      en: "If the app crashes on a specific screen every time even after these steps, I'll log the exact screen for a technical check.",
      hi: "अगर इन स्टेप्स के बाद भी ऐप किसी खास स्क्रीन पर हर बार क्रैश होता है, तो मैं तकनीकी जांच के लिए वह स्क्रीन लॉग कर दूँगा।"
    }
  },
  {
    id: "UPDATE-01",
    label: { en: "App update", hi: "ऐप अपडेट" },
    keywords: ["update", "new version", "old version", "update available",
               "अपडेट", "नया वर्ज़न", "पुराना वर्ज़न"],

let lang = 'en';
let lastMatched = null; // holds last matched KB entry for escalation context

const chat = document.getElementById('chat');
const input = document.getElementById('textInput');

function setLang(l){
  lang = l;
  document.getElementById('langEnBtn').classList.toggle('active', l === 'en');
  document.getElementById('langHiBtn').classList.toggle('active', l === 'hi');
  document.getElementById('subtitle').textContent = STRINGS[lang].subtitle;
  input.placeholder = STRINGS[lang].placeholder;
  document.getElementById('sendBtn').textContent = STRINGS[lang].send;
  document.querySelector('.reset-btn').textContent = STRINGS[lang].reset;
  resetChat();
}

function addMsg(text, who){
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  const label = document.createElement('strong');
  label.textContent = who === 'bot' ? STRINGS[lang].bot : STRINGS[lang].you;
  div.appendChild(label);
  div.appendChild(document.createTextNode(text));
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function addChips(){
  const wrap = document.createElement('div');
  wrap.className = 'chips';
  KB.forEach(entry=>{
    const c = document.createElement('button');
    c.className = 'chip';
    c.textContent = entry.label[lang];
    c.onclick = ()=> submitQuery(entry.keywords[0], entry.label[lang]);
    wrap.appendChild(c);
  });
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

function findMatch(query){
  const q = query.toLowerCase();
  let best = null, bestScore = 0;
  KB.forEach(entry=>{
    let score = 0;
    entry.keywords.forEach(k=>{ if(q.includes(k.toLowerCase())) score++; });
    if(score > bestScore){ bestScore = score; best = entry; }
  });
  return bestScore > 0 ? best : null;
}

function isResolvedSaid(q){
  return /\b(resolved|solved|thanks|thank you|fixed|works|ok got it|okay got it)\b/i.test(q) ||
         /(हल हो गया|धन्यवाद|शुक्रिया|ठीक हो गया)/.test(q);
}
function isNotResolvedSaid(q){
  return /\b(not resolved|not working|still|didn'?t work|no|escalate|need help|talk to someone|human)\b/i.test(q) ||
         /(हल नहीं|काम नहीं|अभी भी|नहीं हुआ)/.test(q);
}

function submitQuery(query, displayLabel){
  addMsg(displayLabel || query, 'user');
  respondTo(query);
}

function respondTo(query){
  if(isNotResolvedSaid(query) && lastMatched){
    showEscalation(lastMatched, query);
    return;
  }
  if(isResolvedSaid(query)){
    addMsg(STRINGS[lang].resolvedReply, 'bot');
    addChips();
    return;
  }

  const match = findMatch(query);
  if(match){
    lastMatched = match;
    addMsg(match.answer[lang], 'bot');
    addMsg(STRINGS[lang].askResolved, 'bot');
  } else {
    lastMatched = null;
    addMsg(STRINGS[lang].notFound, 'bot');
    showEscalation(null, query);
  }
}

function showEscalation(entry, originalQuery){
  const box = document.createElement('div');
  box.className = 'escalate-box';
  const hintText = entry
    ? (entry.escalateHint ? entry.escalateHint[lang] : STRINGS[lang].escalateDefault)
    : STRINGS[lang].escalateDefaultUnmatched;
  box.innerHTML = hintText + "<br><button type='button'>" + STRINGS[lang].logButton + "</button>";
  box.querySelector('button').onclick = ()=> logEscalation(entry, originalQuery, box);
  chat.appendChild(box);
  chat.scrollTop = chat.scrollHeight;
}

function logEscalation(entry, originalQuery, box){
  const ticket = {
    time: new Date().toISOString(),
    category: entry ? entry.id : 'UNMATCHED',
    query: originalQuery,
    lang: lang
  };
  try{
    const existing = JSON.parse(localStorage.getItem('lokos_tickets') || '[]');
    existing.push(ticket);
    localStorage.setItem('lokos_tickets', JSON.stringify(existing));
  }catch(e){}
  box.innerHTML = STRINGS[lang].loggedPrefix + ticket.time.slice(0,16).replace('T',' ') +
    "<br><span style='font-size:12px;opacity:.7'>" + STRINGS[lang].loggedNote + "</span>";
  addChips();
}

function handleSend(){
  const val = input.value.trim();
  if(!val) return;
  input.value = '';
  submitQuery(val);
}

input.addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ handleSend(); }
});

function resetChat(){
  chat.innerHTML = '';
  lastMatched = null;
  addMsg(STRINGS[lang].greeting, 'bot');
  addChips();
}

resetChat();
